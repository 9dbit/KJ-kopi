name: Diagnose Chatvice widget

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-chatvice.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live page and Chatvice bootstrap
        shell: bash
        run: |
          set -uo pipefail
          PAGE='https://kopi-kang-jago-production.up.railway.app/'
          WIDGET='https://chatvice.app/api/widget/chatvice.js?merchant=m_f894751b2c02fe1d&v=1789826150'
          curl -sSL --max-time 30 "$PAGE" -o /tmp/page.html
          curl -sSL --max-time 30 "$WIDGET" -o /tmp/chatvice.js

          echo '=== LIVE PAGE CHATVICE TAG ==='
          grep -n -i 'chatvice' /tmp/page.html || true
          echo '=== CHATVICE SCRIPT SIZE ==='
          wc -c /tmp/chatvice.js
          echo '=== BOOTSTRAP / FETCH / CONFIG REFERENCES ==='
          grep -nEi 'hideLauncher|launcher|fetch\(|XMLHttpRequest|merchant|config|enabled|active|domain|origin|widget-config|widget/config|settings' /tmp/chatvice.js | head -n 180 || true
          echo '=== URLS FOUND IN SCRIPT ==='
          grep -Eo 'https://[^"'\'' )]+' /tmp/chatvice.js | sort -u | head -n 80 || true
